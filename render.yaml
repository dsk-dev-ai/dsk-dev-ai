# Render Blueprint — darshankachare.com
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub (e.g. dsk-dev-ai/dsk-dev-ai).
#   2. Render dashboard → New → Blueprint → select the repo (reads this file).
#   3. Site data is refreshed hourly by .github/workflows/update-profile.yml
#      and committed; Render builds from that snapshot.
#   4. Custom domain darshankachare.com: Render shows the DNS records to add
#      at your registrar (CNAME/A + verification TXT). HTTPS is provisioned
#      automatically once DNS propagates.

services:
  - type: web
    name: darshankachare-com
    runtime: static
    rootDir: site
    # Data is refreshed and committed by the hourly GitHub Action
    # (.github/workflows/update-profile.yml); the deploy builds from the
    # committed snapshot so a rate-limited build can never publish bad data.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    domains:
      - darshankachare.com
    buildFilter:
      # The hourly profile-bot commits (README.md / data/history.json) must not
      # trigger site rebuilds — only changes under site/ should.
      paths:
        - site/**
        - scripts/**
        - render.yaml
    headers:
      # Next.js emits the social preview as an extensionless PNG route.
      - path: /opengraph-image
        name: Content-Type
        value: image/png
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
