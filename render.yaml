# Render Blueprint — darshankachare.com
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub (e.g. dsk-dev-ai/dsk-dev-ai).
#   2. Render dashboard → New → Blueprint → select the repo (reads this file).
#   3. Site data is refreshed hourly by .github/workflows/update-profile.yml
#      when a PROFILE_TOKEN secret is configured (otherwise refresh it locally);
#      Render builds from the committed snapshot.
#   4. Custom domain darshankachare.com: Render shows the DNS records to add
#      at your registrar (CNAME/A + verification TXT). HTTPS is provisioned
#      automatically once DNS propagates.

services:
  - type: web
    name: darshankachare-com
    runtime: static
    rootDir: site
    # Build from the committed snapshot. The hourly GitHub Action refreshes it
    # when a PROFILE_TOKEN secret (PAT with public-repo read access) is set;
    # otherwise run `GH_TOKEN=$(gh auth token) python3 scripts/export_site_data.py`
    # locally and commit the result.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    domains:
      - darshankachare.com
      - www.darshankachare.com
    buildFilter:
      # The hourly profile-bot commits (README.md / data/history.json) must not
      # trigger site rebuilds — only changes under site/ should.
      paths:
        - site/**
        - scripts/**
        - render.yaml
    headers:
      # Next.js emits the social preview as an extensionless PNG route.
      - path: /opengraph-image
        name: Content-Type
        value: image/png
      - path: /feed.xml
        name: Content-Type
        value: application/rss+xml; charset=utf-8
      - path: /feed.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /data.json
        name: Content-Type
        value: application/json; charset=utf-8
      - path: /data.json
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
