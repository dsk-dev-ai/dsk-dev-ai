name: update-profile

on:
  schedule:
    # Every hour — minutes=17 scatters load away from the top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional PAT with public-repo read access. The default GITHUB_TOKEN is
    # scoped to this repository and its search/PAT visibility hides org PRs,
    # so only use it for the site export when a PAT is configured.
    env:
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generator must be trustworthy before it is allowed to write the README.
      - name: Run test suite
        run: python3 -m unittest discover -s tests -t . -q

      - name: Validate renderer against fixtures
        run: python3 scripts/refresh.py --fixtures tests/fixtures --check --quiet

      - name: Restore API response cache
        uses: actions/cache@v4
        with:
          path: .cache/profile
          key: profile-api-${{ github.run_id }}
          restore-keys: |
            profile-api-

      - name: Generate live profile data
        run: python3 scripts/refresh.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export website data
        if: env.PROFILE_TOKEN != ''
        run: python3 scripts/export_site_data.py
        env:
          GH_TOKEN: ${{ env.PROFILE_TOKEN }}

      - name: Guard against API undercount
        if: env.PROFILE_TOKEN != ''
        run: |
          python3 - <<'PY'
          import json, subprocess
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:site/data/profile.json"]))
          with open("site/data/profile.json") as fh:
              new = json.load(fh)
          old_total = old["stats"]["merged_prs_total"]
          new_total = new["stats"]["merged_prs_total"]
          if new_total < old_total:
              print(f"export undercounted merged PRs ({new_total} < {old_total}); keeping committed snapshot")
              subprocess.check_call(["git", "checkout", "HEAD", "--", "site/data/profile.json"])
          PY

      - name: Validate site data
        run: python3 scripts/validate_site_data.py --max-age-hours 30

      - name: Commit and push if changed
        run: |
          git config user.name "dsk-dev-ai[bot]"
          git config user.email "85000000+dsk-dev-ai[bot]@users.noreply.github.com"
          git add README.md data/history.json site/data/profile.json
          if git diff --cached --quiet; then
            echo "profile already up to date"
          else
            git commit -m "chore: refresh live profile data"
            git push
          fi
